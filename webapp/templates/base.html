<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>(function(){try{var t=localStorage.getItem('ztec_theme_v2');}catch(e){}document.documentElement.setAttribute('data-theme', t || 'winter');})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}지텍 AI 메일 비서{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6F6;--card:#fff;--ink:#1E2229;--sub:#6B7280;--line:#E2E4E8;--pri:#0062B2;--pri2:#EAF2FB;--pri3:#00467F;
--gov:#1F4E9A;--in:#0F8F84;--ext:#7B4BC4;--news:#9AA1AB;--sys:#6B7280;--warn:#E41439;--warn2:#FDECEF}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans KR","Malgun Gothic","Pretendard",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.shell > .side{position:sticky;top:0;height:100vh}
.shell .content{min-width:0}
.shell main{margin:24px auto 40px}
header{background:#fff;color:var(--ink);padding:0 24px;height:60px;display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;white-space:nowrap;text-decoration:none}
header .logo img{height:24px;display:block}
header .logo span{border-left:1px solid var(--line);padding-left:10px;line-height:1.2}
header .logo small{display:block;font-size:11px;color:var(--sub);font-weight:500}
header .menu{display:flex;gap:2px;margin-left:auto;height:100%}
header .menu a{display:flex;align-items:center;gap:7px;color:#555B66;padding:0 14px;white-space:nowrap;font-size:14px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
header .menu a:hover{color:var(--ink);text-decoration:none;background:#F8F9FB}
header .menu a.on{color:var(--pri);font-weight:700;border-bottom-color:var(--pri)}
header .menu a.adm{border-left:1px solid var(--line);margin-left:6px}
header .user{display:flex;align-items:center;gap:10px;padding-left:16px;border-left:1px solid var(--line)}
header .me{font-size:12px;color:var(--sub);white-space:nowrap}
header .logout{color:#555B66;border:1px solid var(--line);border-radius:7px;padding:5px 12px;font-size:13px;white-space:nowrap}
header .logout:hover{border-color:#C5CAD3;text-decoration:none;color:var(--ink)}
header .menu a.on .badge-n{background:var(--warn);color:#fff}
main{max-width:1200px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;border-top:4px solid var(--c)}
.kpi .n{font-size:26px;font-weight:700}.kpi .l{color:var(--sub);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:12px}tr:hover td{background:#fafcfd}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;color:#fff;background:var(--c);white-space:nowrap}
.t-정부과제{--c:var(--gov)}.t-사내업무{--c:var(--in)}.t-외부협력{--c:var(--ext)}.t-뉴스레터{--c:var(--news)}.t-시스템알림{--c:var(--sys)}.t-미분류{--c:#cbd5e1}
.dday{font-weight:700;color:var(--warn)}.muted{color:var(--sub)}.small{font-size:12px}
.btn{display:inline-block;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-size:14px;font-family:inherit}.btn:hover{background:#00559C;text-decoration:none}
.btn.gray{background:#e5e7eb;color:var(--ink)}.btn.red{background:var(--warn)}
input[type=text],input[type=email],input[type=password],select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;width:100%}
.msg{background:var(--pri2);border:1px solid #B5D0EE;color:var(--pri3);padding:10px 14px;border-radius:8px;margin-bottom:16px}
.msg.err{background:var(--warn2);border-color:#fecaca;color:var(--warn)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#eef2f6}.bar span{background:var(--c)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters a{padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:#fff}
.filters a.on{background:var(--pri);color:#fff;border-color:var(--pri)}
pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:14px;max-height:520px;overflow:auto}
.act{color:var(--warn);font-weight:600}
.periodbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.periodbar a{padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:13px}
.periodbar a.on{background:var(--pri);color:#fff;border-color:var(--pri)}.periodbar input[type=date]{padding:6px 8px;border:1px solid var(--line);border-radius:8px}
.badge-n{display:inline-block;min-width:18px;padding:0 5px;margin-left:2px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:18px}
.unread td{background:#F1F7FD}.unread td:first-child{border-left:3px solid var(--pri)}
.periodbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.topbar{padding:10px 16px}
.statline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:12px;color:var(--sub)}
.chip i,.cattabs i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.chip b{color:var(--ink)}.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}
.chip:hover,.cattabs a:hover{text-decoration:none;border-color:var(--c,var(--pri))}
.bar.thin{height:4px;margin:8px 0 10px}
.scroll5{overflow-y:auto;scrollbar-width:thin}.scroll5.more{border-bottom:1px dashed var(--line)}
.scroll5 tr:last-child td{border-bottom:0}
.cattabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px;margin-bottom:10px;background:#f1f5f9;border-radius:10px}
.cattabs a{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;color:#475569;border:1px solid transparent}
.cattabs a b{font-weight:700;font-size:12px;padding:1px 7px;border-radius:9px;background:#e2e8f0;color:#334155}
.cattabs a.on{background:var(--c,var(--pri));color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.cattabs a.on i{background:#fff}.cattabs a.on b{background:rgba(255,255,255,.25);color:#fff}
.cattabs a.all{--c:var(--pri)}
.cattabs .search{margin-left:auto;display:flex;gap:6px}.cattabs .search input{width:220px}
.mailbox{max-height:68vh;overflow-y:auto;border:1px solid var(--line);border-radius:8px;scrollbar-width:thin}
.mailbox thead th{position:sticky;top:0;background:#f8fafc;z-index:1;box-shadow:0 1px 0 var(--line)}

/* ── 배경 테마: 겨울·가을 (지텍 블루 하늘 + 단풍) ── */
html[data-theme=autumn] body{background:#F3E6D3 url(/theme/autumn.svg) center bottom/cover fixed}
html[data-theme=winter] body{background:#DCEAF7 url(/theme/winter.svg) center bottom/cover fixed}
html[data-theme=winter] .side{background:rgba(255,255,255,.82)!important}
:is([data-theme=autumn],[data-theme=winter]) .shell{padding:10px;gap:10px}
:is([data-theme=autumn],[data-theme=winter]) .shell > .side{top:10px;height:calc(100vh - 20px);border-radius:16px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
:is([data-theme=autumn],[data-theme=winter]) .shell .content{background:rgba(246,246,246,.9);border-radius:16px;box-shadow:0 4px 20px rgba(60,40,20,.12);min-height:calc(100vh - 20px)}
:is([data-theme=autumn],[data-theme=winter]) .shell main{margin-top:20px}
:is([data-theme=autumn],[data-theme=winter]) header{background:rgba(255,255,255,.85);backdrop-filter:blur(8px)}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
{% if cats %}<style>{% for c in cats %}{% if c.color %}.t-{{ c.code }}{--c:{{ c.color }}}{% endif %}{% endfor %}</style>{% endif %}
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="b-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
<symbol id="b-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></symbol>
<symbol id="b-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
<symbol id="b-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></symbol>
<symbol id="b-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
<symbol id="b-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
</defs></svg>
{% if me and sb %}
<div class="shell">
  {% include "_sidebar.html" %}
  <div class="content"><main>{% block body %}{% endblock %}</main></div>
</div>
{% else %}
<header>
  <a class="logo" href="/"><img src="{{ logo }}" alt="Z-TEC"><span>메일 비서<small>AI Mail Assistant</small></span></a>
  {% if me %}<div class="user" style="margin-left:auto"><span class="me">{{ me }}</span><a href="/logout" class="logout">로그아웃</a></div>{% endif %}
</header>
<main>{{ self.body() }}</main>
{% endif %}
{% if me %}<script>
(function(){
  var base = document.title, last = null;
  function poll(){
    fetch('/api/alerts/count', {credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){
      var b = document.getElementById('badge');
      if (d.unread > 0){ b.textContent = d.unread > 99 ? '99+' : d.unread; b.style.display = 'inline-block'; document.title = '(' + d.unread + ') ' + base; }
      else { b.style.display = 'none'; document.title = base; }
      if (last !== null && d.last_id > last){ var n = document.getElementById('newtoast'); if (n){ n.style.display='block'; } }
      last = d.last_id;
    }).catch(function(){});
  }
  poll(); setInterval(poll, 60000);
})();
</script>
<a id="newtoast" href="/alerts" style="display:none;position:fixed;right:20px;bottom:20px;background:#1E2229;color:#fff;padding:14px 18px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-weight:700">🔔 새 알림이 도착했습니다 →</a>
{% endif %}
</body>
</html>
